name: Build iOS IPA

# 产出未签名 ipa（TrollStore / Sideloadly / AltStore 自签用）。
# macos-14 runner 自带 Xcode，能把 ios/ 工程编译成 ARM64 Mach-O。
#
# 注意：这里刻意不碰 secrets。
#   GitHub 不允许在 `if:` 里引用 secrets 上下文，写了会让整个 workflow
#   在语义校验阶段被拒（表现：name 读不出来、jobs 数量 0、秒失败）。
#   要出签名版就单独加一个 workflow，用 env 中转后再 if。

on:
  push:
    branches: [main, master]
    paths:
      - 'ios/**'
      - 'Sources/**'
      - 'tools/**'
      - 'scripts/build-ipa.sh'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: 定位工程根
        run: |
          if [ -f apple/ios/TxinApp.xcodeproj/project.pbxproj ]; then
            echo "PROJ=apple" >> "$GITHUB_ENV"
          elif [ -f ios/TxinApp.xcodeproj/project.pbxproj ]; then
            echo "PROJ=." >> "$GITHUB_ENV"
          else
            echo "::error::没找到 ios/TxinApp.xcodeproj"
            exit 1
          fi

      - name: 工具链
        run: |
          xcodebuild -version
          xcode-select -p
          sw_vers
          uname -m

      - name: 重新生成 Xcode 工程并校验
        working-directory: ${{ env.PROJ }}
        run: |
          python3 tools/gen_ios_xcodeproj.py --verify

      - name: 源码结构自查
        working-directory: ${{ env.PROJ }}
        run: |
          if command -v node >/dev/null 2>&1 && [ -f scripts/lint_swift.mjs ]; then
            node scripts/lint_swift.mjs ios || true
          fi

      - name: 打未签名 ipa
        working-directory: ${{ env.PROJ }}
        run: |
          chmod +x scripts/build-ipa.sh
          ./scripts/build-ipa.sh --unsigned

      - name: 产物清单
        working-directory: ${{ env.PROJ }}
        run: |
          ls -la build/*.ipa || true
          echo "--- Mach-O ---"
          file build/dd/Build/Products/Release-iphoneos/Txin.app/Txin || true
          lipo -info build/dd/Build/Products/Release-iphoneos/Txin.app/Txin || true
          echo "--- bundle ---"
          ls -la build/dd/Build/Products/Release-iphoneos/Txin.app | head -25 || true

      - name: 上传 ipa
        uses: actions/upload-artifact@v4
        with:
          name: Txin-ipa-unsigned-${{ github.run_number }}
          path: ${{ env.PROJ }}/build/*.ipa
          if-no-files-found: error
          retention-days: 30
