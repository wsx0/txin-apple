name: Build macOS App

# 没有 Mac 也能出 .app：
#   1. 推到 GitHub，进 Actions 页
#   2. 选「Build macOS App」→ Run workflow（push 到 main 也会自动跑）
#   3. 跑完在 Artifacts 里下 Txin-macos.zip（内含 Txin.app，可选 Txin.dmg）
#
# 产物是 ad-hoc 签名（未公证）：首次打开要右键 App →「打开」。
#
# 这个 workflow 自适应两种仓库布局：
#   · 仓库根就是 apple/          → PROJ=.
#   · 仓库根是 apple 的上级       → PROJ=apple

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      make_dmg:
        description: '同时产出 dmg'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 定位工程根
        run: |
          if [ -f apple/Package.swift ]; then
            echo "PROJ=apple" >> "$GITHUB_ENV"
          elif [ -f Package.swift ]; then
            echo "PROJ=." >> "$GITHUB_ENV"
          else
            echo "::error::没找到 Package.swift"
            exit 1
          fi
          echo "工程根 = $( [ "$PROJ" = "." ] && pwd || echo "$PWD/apple" )"

      - name: 工具链信息
        run: |
          swift --version
          xcodebuild -version || true
          sw_vers
          uname -m

      - name: 缓存 SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.swift') }}
          restore-keys: ${{ runner.os }}-spm-

      # ---------------- 第 1 关：协议自检 ----------------
      # 密码学实现不对就没必要往下编译 App
      - name: 编译 CLI
        working-directory: ${{ env.PROJ }}
        run: swift build -c release --product txin

      - name: 协议金标自检
        working-directory: ${{ env.PROJ }}
        run: |
          VECTORS=test-vectors.json
          [ -f "$VECTORS" ] || VECTORS="../test-vectors.json"
          .build/release/txin selftest --vectors "$VECTORS"

      # ---------------- 第 2 关：结构自查（失败不阻断） ----------------
      - name: 结构自查
        working-directory: ${{ env.PROJ }}
        run: |
          if [ -f scripts/lint_swift.mjs ] && command -v node >/dev/null; then
            node scripts/lint_swift.mjs . || true
          else
            echo "跳过（无 node 或无脚本）"
          fi

      # ---------------- 第 3 关：打包 ----------------
      - name: 打包 .app
        working-directory: ${{ env.PROJ }}
        run: |
          chmod +x scripts/build-app.sh
          WANT_DMG="true"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.make_dmg }}" = "false" ]; then
            WANT_DMG="false"
          fi
          echo "make_dmg = $WANT_DMG"
          if [ "$WANT_DMG" = "true" ]; then
            ./scripts/build-app.sh --dmg
          else
            ./scripts/build-app.sh
          fi

      - name: 产物清单与校验
        working-directory: ${{ env.PROJ }}
        run: |
          echo "--- build/ ---"
          ls -la build/ || true
          echo "--- bundle ---"
          find build/Txin.app -type f | head -30
          du -sh build/Txin.app || true
          echo "--- 签名 ---"
          codesign -dv --verbose=2 build/Txin.app 2>&1 || true
          codesign --verify --deep --strict build/Txin.app && echo "✓ 签名校验通过"
          echo "--- 可执行文件架构 ---"
          lipo -info build/Txin.app/Contents/MacOS/Txin || true

      - name: 冒烟测试（CLI 直连真实接口）
        working-directory: ${{ env.PROJ }}
        continue-on-error: true
        run: |
          # runner 在境外，CloudFront 与国内 CDN 都通，顺便验证端到端
          .build/release/txin cdn     || true
          .build/release/txin info    || true
          .build/release/txin detail 309770 || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Txin-macos-${{ github.run_number }}
          path: |
            ${{ env.PROJ }}/build/Txin.app
            ${{ env.PROJ }}/build/*.dmg
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  # ---------------- 分发（需要 Apple Developer 账号） ----------------
  # 要给别人直接双击用，得 Developer ID 签名 + 公证：
  #   security create-keychain ... && security import cert.p12 ...
  #   codesign --deep --force --options runtime --sign "Developer ID Application: XXX (TEAMID)" Txin.app
  #   xcrun notarytool submit Txin.dmg --apple-id ... --team-id ... --password ... --wait
  #   xcrun stapler staple Txin.dmg
  # 对应的 secrets：MAC_CERT_P12_BASE64 / MAC_CERT_PASSWORD / APPLE_ID / APPLE_TEAM_ID / APPLE_APP_PASSWORD
